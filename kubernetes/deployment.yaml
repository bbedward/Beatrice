apiVersion: apps/v1
kind: Deployment
metadata:
  name: beatrice
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: beatrice
  template:
    metadata:
      labels:
        app: beatrice
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: beatrice
        image: replaceme
        envFrom:
          - configMapRef:
              name: beatrice
        env:
          - name: REDIS_HOST
            value: redis.redis
          - name: DB_PATH
            value: /database/discord.db
          - name: BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: beatrice
                key: bot_token
        volumeMounts:
        - name: database
          mountPath: /database
          readOnly: false
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: database
